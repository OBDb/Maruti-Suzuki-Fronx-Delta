    description: "The Maruti Suzuki Fronx Delta is a specific trim level of the first-generation Fronx, a subcompact crossover SUV (B-segment) produced by Suzuki through its Indian subsidiary Maruti Suzuki since 2023. The Fronx name is a portmanteau of 'Frontier Next'. Built on Suzuki's HEARTECT B platform shared with the Baleno hatchback, the Fronx features coupe-SUV styling with a sloping roofline and is positioned below the Brezza in Maruti's SUV lineup. The Delta trim is one of five variants offered in India (Sigma, Delta, Delta+, Zeta, Alpha), positioned as a mid-range option. The Delta trim is powered by the 1.2-liter K12N Dualjet petrol engine producing approximately 82-88 bhp and 113 Nm of torque, paired with a 5-speed manual or 5-speed AMT automated manual transmission. Standard features include a 7-inch Smartplay touchscreen infotainment system with wireless Apple CarPlay and Android Auto, automatic climate control, keyless entry, push-button start, LED projector headlamps with LED DRLs, 16-inch wheels, and electrically adjustable outside mirrors. Safety equipment includes dual front airbags, ABS with EBD, rear parking sensors, and electronic stability program. The Fronx is sold exclusively through Maruti's premium NEXA dealership network in India, with exports to various global markets including Middle East, Latin America, Africa, Australia, Japan, Southeast Asia, and Mexico since July 2023."
